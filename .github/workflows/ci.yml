name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: checkout verified skill suite
        uses: actions/checkout@v4
        with:
          repository: xi-kari/delta-me13-skill
          ref: 4ecfa005d61db118518deff8512aaeadd04cc478
          path: .suite-fixture
          sparse-checkout: skills
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts
      - name: validate skill suite
        run: python .suite-fixture/skills/amphoreus/scripts/validate.py --root .suite-fixture/skills --wave all
      - run: npm test
        env:
          AMPHOREUS_REAL_SUITE: ${{ github.workspace }}/.suite-fixture/skills
      - run: npm run build
      - run: npm run verify:dist
      - name: pack listing
        run: npm pack --dry-run --ignore-scripts
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: lib
          path: lib/
          retention-days: 7
