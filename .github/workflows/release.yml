name: release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-published:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: checkout verified skill suite
        uses: actions/checkout@v4
        with:
          repository: xi-kari/delta-me13-skill
          ref: 4ecfa005d61db118518deff8512aaeadd04cc478
          path: .suite-fixture
          sparse-checkout: skills
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts
      - name: validate skill suite
        run: python .suite-fixture/skills/amphoreus/scripts/validate.py --root .suite-fixture/skills --wave all
      - run: npm run release:check
        env:
          AMPHOREUS_REAL_SUITE: ${{ github.workspace }}/.suite-fixture/skills
      - name: tag matches package.json
        run: node -e "const v=require('./package.json').version; if ('v'+v!==process.env.GITHUB_REF_NAME) { console.error('tag',process.env.GITHUB_REF_NAME,'!= v'+v); process.exit(1) }"
      - name: verify complete package published from this tag
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { execFileSync } from 'node:child_process'
          import { createHash } from 'node:crypto'
          import { mkdtempSync, readFileSync, writeFileSync } from 'node:fs'
          import { tmpdir } from 'node:os'
          import { join } from 'node:path'
          import { inspectBundledResources } from './src/host/bundled-resources.ts'

          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'))
          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}`)
          if (!response.ok) throw new Error(`Unable to inspect the npm release: HTTP ${response.status}`)
          const registry = await response.json()
          const release = registry.versions?.[version]
          if (release === undefined) throw new Error(`${name}@${version} is unpublished. Publish the verified with-assets tarball with --tag alpha before pushing its tag; this workflow never publishes the source directory.`)
          assert.equal(release.gitHead, process.env.GITHUB_SHA, 'Registry gitHead does not match the tagged source commit.')
          assert.equal(registry['dist-tags']?.alpha, version, 'Registry alpha does not point to this version.')
          const url = new URL(release.dist.tarball)
          assert.equal(url.hostname, 'registry.npmjs.org', 'Unexpected release tarball host.')
          url.protocol = 'https:'
          const download = await fetch(url)
          assert.equal(download.status, 200, 'Cannot download the published tarball.')
          const bytes = Buffer.from(await download.arrayBuffer())
          const integrity = `sha512-${createHash('sha512').update(bytes).digest('base64')}`
          assert.ok(release.dist.integrity.split(/\s+/u).includes(integrity), 'Registry tarball integrity does not match its metadata.')
          const directory = mkdtempSync(join(tmpdir(), 'amphoreus-release-'))
          const archive = join(directory, 'release.tgz')
          writeFileSync(archive, bytes)
          const entries = execFileSync('tar', ['-tzf', archive], { encoding: 'utf8' }).trim().split(/\r?\n/u)
          assert.ok(entries.every(path => path.startsWith('package/') && !path.includes('\\') && !path.includes(':') && !path.split('/').includes('..')), 'Unsafe published archive paths.')
          const types = execFileSync('tar', ['-tvzf', archive], { encoding: 'utf8' }).trim().split(/\r?\n/u)
          assert.ok(types.every(line => line.startsWith('-') || line.startsWith('d')), 'Published archive contains links or special entries.')
          execFileSync('tar', ['-xzf', archive, '-C', directory])
          const packaged = JSON.parse(readFileSync(join(directory, 'package', 'package.json'), 'utf8'))
          assert.equal(packaged.name, name)
          assert.equal(packaged.version, version)
          assert.equal(packaged.gitHead, process.env.GITHUB_SHA, 'Tarball gitHead does not match the tagged source commit.')
          assert.equal(packaged.dsh?.bundle?.patch, './cordis.patch.yml')
          assert.equal(packaged.dsh?.client?.platform, 'web')
          const resources = await inspectBundledResources(join(directory, 'package', 'resources'))
          assert.equal(resources.originals, 77, 'The published package omits the full original artwork set.')
          assert.equal(resources.derived, 108, 'The published package omits the full derived artwork set.')
          assert.equal(entries.filter(path => /^package\/resources\/(?:assets|assets-cache)\//u.test(path)).length, 185)
          assert.ok(['preinstall', 'install', 'postinstall', 'prepare', 'prepack', 'postpack', 'prepublishOnly'].every(hook => packaged.scripts?.[hook] === undefined), 'The published package still has install/build lifecycle hooks.')
          console.log(JSON.stringify({ package: name, version, gitHead: packaged.gitHead, originals: resources.originals, derived: resources.derived, sha256: createHash('sha256').update(bytes).digest('hex') }))
          NODE
